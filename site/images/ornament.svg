<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hearts and diamond, after the corner ornaments of the paper menu. Used as a CSS mask. -->
  <g stroke-width="1.6">
    <!-- side lines ending with dots -->
    <path d="M10 22 H74"/>
    <path d="M186 22 H250"/>
    <circle cx="6" cy="22" r="1.8" fill="#000" stroke="none"/>
    <circle cx="254" cy="22" r="1.8" fill="#000" stroke="none"/>
    <!-- small diamonds on the lines -->
    <path d="M40 18.5 L43.5 22 L40 25.5 L36.5 22 Z"/>
    <path d="M220 18.5 L223.5 22 L220 25.5 L216.5 22 Z"/>
    <!-- hearts pointing to the centre -->
    <path d="M78 22 C78 15 86 12 90 17 C94 12 102 15 102 22 C102 28 94 31 90 36 C86 31 78 28 78 22 Z" transform="rotate(-90 90 22)"/>
    <path d="M158 22 C158 15 166 12 170 17 C174 12 182 15 182 22 C182 28 174 31 170 36 C166 31 158 28 158 22 Z" transform="rotate(90 170 22)"/>
    <!-- inner curls of the hearts -->
    <path d="M86 22 C86 19 89 18 91 20"/>
    <path d="M174 22 C174 19 171 18 169 20"/>
    <!-- central diamond -->
    <path d="M130 6 L146 22 L130 38 L114 22 Z"/>
    <path d="M130 14 L138 22 L130 30 L122 22 Z"/>
    <circle cx="130" cy="22" r="1.8" fill="#000" stroke="none"/>
  </g>
</svg>
