# Netlify: publish the La Terrasse de la Medersa site (static, no build step)
[build]
  publish = "site"
  command = ""

# The service worker must always be re-checked so phones get updates quickly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Photos and icons rarely change: cache them for a week
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
